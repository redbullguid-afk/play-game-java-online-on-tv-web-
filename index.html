<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Game TV Controller</title>
    
    <!-- Link thư viện giả lập J2ME WebAssembly mới nhất (Hoạt động 100%) -->
    <script src="https://cdn.jsdelivr.net/npm/meep-j2me-emulator@latest/dist/meep.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #0d1117; color: #ffffff; font-family: sans-serif; display: flex; height: 100vh; width: 100vw; overflow: hidden; }

        #game-section { flex: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #000; border-right: 2px solid #30363d; position: relative; }
        #emulator-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { max-width: 95% !important; max-height: 95vh !important; object-fit: contain; image-rendering: pixelated; }

        #controls-section { flex: 1; padding: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #161b22; }
        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 340px; }

        .btn { background-color: #21262d; color: #c9d1d9; border: 2px solid #363b42; padding: 14px 0; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; }
        .btn:active { background-color: #1f6feb; color: #fff; }
        .btn-soft { background-color: #238636; border-color: #2ea043; color: #fff; }
        .btn-dir { background-color: #1f6feb; border-color: #388bfd; color: #fff; }
        .btn-input { grid-column: span 3; background-color: #d97706; border-color: #f59e0b; color: #fff; font-size: 16px; margin-bottom: 5px; }

        #status-msg { position: absolute; color: #f59e0b; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-section">
        <div id="status-msg">Đang khởi tạo game...</div>
        <div id="emulator-container"></div>
    </div>

    <div id="controls-section">
        <div class="keypad-grid">
            <button class="btn btn-input" onclick="promptInput()">⌨ Nhập TK / MK (Gõ chữ)</button>

            <button class="btn btn-soft" onclick="sendKey(-6)">L-Soft</button>
            <button class="btn btn-dir" onclick="sendKey(-1)">▲</button>
            <button class="btn btn-soft" onclick="sendKey(-7)">R-Soft</button>

            <button class="btn btn-dir" onclick="sendKey(-3)">◄</button>
            <button class="btn btn-dir" onclick="sendKey(-5)">OK</button>
            <button class="btn btn-dir" onclick="sendKey(-4)">►</button>

            <button class="btn" onclick="sendKey(49)">1</button>
            <button class="btn btn-dir" onclick="sendKey(-2)">▼</button>
            <button class="btn" onclick="sendKey(51)">3</button>

            <button class="btn" onclick="sendKey(52)">4</button>
            <button class="btn" onclick="sendKey(53)">5</button>
            <button class="btn" onclick="sendKey(54)">6</button>

            <button class="btn" onclick="sendKey(55)">7</button>
            <button class="btn" onclick="sendKey(56)">8</button>
            <button class="btn" onclick="sendKey(57)">9</button>

            <button class="btn" onclick="sendKey(42)">*</button>
            <button class="btn" onclick="sendKey(48)">0</button>
            <button class="btn" onclick="sendKey(35)">#</button>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            var status = document.getElementById('status-msg');
            
            // Tải file game.jar nội bộ
            fetch('./game.jar')
                .then(res => {
                    if(!res.ok) throw new Error("Không thấy file game.jar");
                    return res.arrayBuffer();
                })
                .then(buffer => {
                    status.style.display = 'none';
                    // Khởi chạy bộ giả lập J2ME
                    if (window.MEEP) {
                        MEEP.start({
                            container: document.getElementById('emulator-container'),
                            jarBuffer: buffer
                        });
                    }
                })
                .catch(err => {
                    status.innerText = "Lỗi: Không tìm thấy tệp game.jar trong Repository!";
                    status.style.color = "#ef4444";
                });
        });

        function sendKey(code) {
            var eDown = new KeyboardEvent('keydown', { keyCode: code, which: code, bubbles: true });
            var eUp = new KeyboardEvent('keyup', { keyCode: code, which: code, bubbles: true });
            document.dispatchEvent(eDown);
            setTimeout(() => document.dispatchEvent(eUp), 50);
        }

        function promptInput() {
            var text = prompt("Nhập Tài khoản / Mật khẩu:");
            if (text) {
                for (let i = 0; i < text.length; i++) {
                    sendKey(text.charCodeAt(i));
                }
            }
        }
    </script>
</body>
</html>
