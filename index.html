<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Game Online TV Controller</title>
    
    <!-- Nhúng bộ giả lập J2ME WebAssembly ổn định nhất -->
    <script src="https://cdn.jsdelivr.net/npm/j2me-js@0.1.3/dist/j2me.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #0d1117; color: #ffffff; font-family: sans-serif; display: flex; height: 100vh; width: 100vw; overflow: hidden; position: relative; }

        /* KHU VỰC CHẠY GAME */
        #game-section { flex: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #000; border-right: 2px solid #30363d; position: relative; }
        #emulator-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { max-width: 95% !important; max-height: 95vh !important; object-fit: contain; image-rendering: pixelated; }

        /* KHU VỰC BÀN PHÍM MAGIC REMOTE */
        #controls-section { flex: 1; padding: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #161b22; }
        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 340px; }

        .btn { background-color: #21262d; color: #c9d1d9; border: 2px solid #363b42; padding: 14px 0; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; }
        .btn:active { background-color: #1f6feb; color: #fff; }
        .btn-soft { background-color: #238636; border-color: #2ea043; color: #fff; }
        .btn-dir { background-color: #1f6feb; border-color: #388bfd; color: #fff; }
        .btn-input { grid-column: span 3; background-color: #d97706; border-color: #f59e0b; color: #fff; font-size: 16px; margin-bottom: 5px; }

        /* MÀN HÌNH NHẬP LIỆU TRẮNG XOÁ (DIALOG) */
        #input-dialog-overlay { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #ffffff; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .dialog-box { width: 90%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .dialog-title { color: #111827; font-size: 20px; font-weight: bold; text-align: center; }
        .dialog-input { width: 100%; padding: 14px; font-size: 20px; border: 3px solid #2563eb; border-radius: 8px; outline: none; color: #000; background-color: #f8fafc; }
        .dialog-actions { display: flex; gap: 10px; width: 100%; }
        .btn-dialog { flex: 1; padding: 14px 0; font-size: 18px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-dialog-ok { background-color: #16a34a; color: #fff; }
        .btn-dialog-back { background-color: #dc2626; color: #fff; }
        #status-msg { position: absolute; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

    <div id="game-section">
        <div id="status-msg">Đang tải game...</div>
        <div id="emulator-container"></div>
    </div>

    <div id="controls-section">
        <div class="keypad-grid">
            <button class="btn btn-input" onclick="openInputDialog()">⌨ Nhập TK / MK (Gõ chữ)</button>

            <button class="btn btn-soft" onmousedown="sendKey(-6)" onmouseup="sendKeyUp(-6)">L-Soft</button>
            <button class="btn btn-dir" onmousedown="sendKey(-1)" onmouseup="sendKeyUp(-1)">▲</button>
            <button class="btn btn-soft" onmousedown="sendKey(-7)" onmouseup="sendKeyUp(-7)">R-Soft</button>

            <button class="btn btn-dir" onmousedown="sendKey(-3)" onmouseup="sendKeyUp(-3)">◄</button>
            <button class="btn btn-dir" onmousedown="sendKey(-5)" onmouseup="sendKeyUp(-5)">OK</button>
            <button class="btn btn-dir" onmousedown="sendKey(-4)" onmouseup="sendKeyUp(-4)">►</button>

            <button class="btn" onmousedown="sendKey(49)" onmouseup="sendKeyUp(49)">1</button>
            <button class="btn btn-dir" onmousedown="sendKey(-2)" onmouseup="sendKeyUp(-2)">▼</button>
            <button class="btn" onmousedown="sendKey(51)" onmouseup="sendKeyUp(51)">3</button>

            <button class="btn" onmousedown="sendKey(52)" onmouseup="sendKeyUp(52)">4</button>
            <button class="btn" onmousedown="sendKey(53)" onmouseup="sendKeyUp(53)">5</button>
            <button class="btn" onmousedown="sendKey(54)" onmouseup="sendKeyUp(54)">6</button>

            <button class="btn" onmousedown="sendKey(55)" onmouseup="sendKeyUp(55)">7</button>
            <button class="btn" onmousedown="sendKey(56)" onmouseup="sendKeyUp(56)">8</button>
            <button class="btn" onmousedown="sendKey(57)" onmouseup="sendKeyUp(57)">9</button>

            <button class="btn" onmousedown="sendKey(42)" onmouseup="sendKeyUp(42)">*</button>
            <button class="btn" onmousedown="sendKey(48)" onmouseup="sendKeyUp(48)">0</button>
            <button class="btn" onmousedown="sendKey(35)" onmouseup="sendKeyUp(35)">#</button>
        </div>
    </div>

    <div id="input-dialog-overlay">
        <div class="dialog-box">
            <div class="dialog-title">NHẬP VĂN BẢN (TK / MK)</div>
            <input type="text" id="dialog-text-input" class="dialog-input" placeholder="Bấm vào đây để gõ..." autofocus>
            <div class="dialog-actions">
                <button class="btn-dialog btn-dialog-ok" onclick="submitInputDialog()">OK (Đồng ý)</button>
                <button class="btn-dialog btn-dialog-back" onclick="closeInputDialog()">Quay lại</button>
            </div>
        </div>
    </div>

    <script>
        // Xử lý nạp file game.jar
        window.addEventListener('load', function() {
            var status = document.getElementById('status-msg');
            
            // Khởi chạy engine Java
            fetch('./game.jar')
                .then(response => {
                    if (!response.ok) throw new Error("Không tìm thấy file game.jar");
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    status.style.display = 'none';
                    if (window.J2ME) {
                        J2ME.start({
                            container: document.getElementById('emulator-container'),
                            jarBuffer: buffer
                        });
                    }
                })
                .catch(err => {
                    status.innerText = "Lỗi: Hãy đảm bảo bạn đã đổi tên file thành game.jar";
                    status.style.color = "#ff4d4d";
                });
        });

        function sendKey(code) {
            var evt = new KeyboardEvent('keydown', { keyCode: code, which: code, bubbles: true });
            document.dispatchEvent(evt);
        }

        function sendKeyUp(code) {
            var evt = new KeyboardEvent('keyup', { keyCode: code, which: code, bubbles: true });
            document.dispatchEvent(evt);
        }

        // Bắt nút Remote TV LG
        window.addEventListener('keydown', function(e) {
            if (document.getElementById('input-dialog-overlay').style.display === 'flex') {
                if (e.keyCode === 13) submitInputDialog();
                return;
            }
            switch(e.keyCode) {
                case 38: sendKey(-1); break; // Up
                case 40: sendKey(-2); break; // Down
                case 37: sendKey(-3); break; // Left
                case 39: sendKey(-4); break; // Right
                case 13: sendKey(-5); break; // OK
            }
        });

        window.addEventListener('keyup', function(e) {
            if (document.getElementById('input-dialog-overlay').style.display === 'flex') return;
            switch(e.keyCode) {
                case 38: sendKeyUp(-1); break;
                case 40: sendKeyUp(-2); break;
                case 37: sendKeyUp(-3); break;
                case 39: sendKeyUp(-4); break;
                case 13: sendKeyUp(-5); break;
            }
        });

        function openInputDialog() {
            var overlay = document.getElementById('input-dialog-overlay');
            var input = document.getElementById('dialog-text-input');
            input.value = '';
            overlay.style.display = 'flex';
            setTimeout(() => input.focus(), 100);
        }

        function closeInputDialog() {
            document.getElementById('input-dialog-overlay').style.display = 'none';
        }

        function submitInputDialog() {
            var text = document.getElementById('dialog-text-input').value;
            if (text) {
                for (let i = 0; i < text.length; i++) {
                    let charCode = text.charCodeAt(i);
                    sendKey(charCode);
                    sendKeyUp(charCode);
                }
            }
            closeInputDialog();
        }
    </script>
</body>
</html>
